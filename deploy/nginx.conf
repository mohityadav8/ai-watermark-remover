# nginx: serves the static web UI and reverse-proxies /api/* to the Python
# cleaning service (wr-core). Frontend and API share one origin, so there is
# no CORS to configure — the browser only ever talks to this server.

server {
    listen       80;
    server_name  _;

    # The service caps decoded input at 256 MiB; base64 in the JSON envelope
    # inflates by ~4/3, so allow generous headroom for the request body.
    client_max_body_size 512m;

    # ---- static frontend ----
    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # long cache for fingerprint-free static assets is fine here since the
    # files are small; keep it modest so updates show up.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=300";
    }

    # ---- API reverse proxy ----
    # /api/health -> http://wr-core:8765/health, etc. The trailing slash on
    # both sides strips the /api prefix before forwarding.
    location /api/ {
        proxy_pass         http://wr-core:8765/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Large uploads + cleaning (esp. PDF deep-image passes) can take a
        # while; give the upstream room before timing out.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # basic hardening
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
}
